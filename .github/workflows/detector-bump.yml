name: Detector bumps

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detector-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      families: ${{ steps.detect.outputs.families }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-detector-bump
      - id: detect
        name: Detect newer benchmarked families
        run: |
          python .github/scripts/bump_detectors.py \
            --k4geo "$K4GEO" --fcc-config "$FCCCONFIG" > "$RUNNER_TEMP/bumps.json"
          cat "$RUNNER_TEMP/bumps.json"
          echo "families=$(jq -c '[.[].family]' "$RUNNER_TEMP/bumps.json")" >> "$GITHUB_OUTPUT"

  pr:
    needs: detect
    if: needs.detect.outputs.families != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.detect.outputs.families) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: open
        name: Leave an open bump PR to its reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bump/${{ matrix.family }}
        run: |
          # Regenerating the branch would force-push over maintainer commits.
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            echo "::notice::PR #$number is open on $BRANCH; leaving it untouched. Merge or close it to propose a newer version."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-detector-bump
        if: steps.open.outputs.exists != 'true'
      - id: bump
        if: steps.open.outputs.exists != 'true'
        name: Apply this family
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python .github/scripts/bump_detectors.py \
            --k4geo "$K4GEO" --fcc-config "$FCCCONFIG" --family "$FAMILY" --apply \
            > "$RUNNER_TEMP/bump.json"
          cat "$RUNNER_TEMP/bump.json"
          echo "changed=$(jq 'length > 0' "$RUNNER_TEMP/bump.json")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.[0].new // "" | split("_") | last' "$RUNNER_TEMP/bump.json")" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        if: steps.bump.outputs.changed == 'true'
        with:
          token: ${{ github.token }}
          branch: bump/${{ matrix.family }}
          delete-branch: true
          title: 'feat(benchmarks): bump ${{ matrix.family }} to ${{ steps.bump.outputs.version }}'
          commit-message: 'feat(benchmarks): bump ${{ matrix.family }} to ${{ steps.bump.outputs.version }}'
          body-path: ${{ runner.temp }}/bump-${{ matrix.family }}.md
          labels: detector-bump
          sign-commits: true
