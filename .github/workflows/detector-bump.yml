name: Detector bumps

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One queue for the whole repository: the open-PR check and bump/<family>
# branches are global, so runs on different refs must not interleave.
concurrency:
  group: detector-bump
  cancel-in-progress: false

jobs:
  detect:
    # Open and rejected bump PRs are tracked repository-wide, so only the
    # default branch may propose bumps; test the workflow in a fork.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      families: ${{ steps.detect.outputs.families }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-detector-bump
      - id: detect
        name: Detect newer benchmarked families
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A bump PR closed unmerged rejects that exact version; skip it so the
          # next family can proceed. Titles read "... bump <family> to vNN".
          # Fork PRs list their branch without an owner, so count only this
          # repository's bump/ branches.
          gh pr list --repo "$GITHUB_REPOSITORY" --state closed --limit 1000 \
            --json headRefName,isCrossRepository,title,mergedAt \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("bump/")) and .mergedAt == null)
              | .title | capture("bump (?<family>[A-Za-z0-9_-]+) to (?<version>v[0-9]+)$")
              | "\(.family)_\(.version)"]' > "$RUNNER_TEMP/rejected.json"
          cat "$RUNNER_TEMP/rejected.json"
          python .github/scripts/bump_detectors.py \
            --k4geo "$K4GEO" --fcc-config "$FCCCONFIG" --rejected "$RUNNER_TEMP/rejected.json" \
            > "$RUNNER_TEMP/bumps.json"
          cat "$RUNNER_TEMP/bumps.json"
          # Every bump edits the shared lineage blocks, and an open PR is never
          # regenerated (that would force-push over maintainer commits). Propose
          # one family at a time so each PR starts from a main with the last merged.
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,headRefName,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("bump/"))) | "#\(.number)"] | join(", ")')"
          if [[ -n "$open" ]]; then
            echo "::notice::Detector-bump PR $open is open; merge or close it to propose the next bump."
            families='[]'
          else
            families="$(jq -c '[.[].family][:1]' "$RUNNER_TEMP/bumps.json")"
          fi
          echo "families=$families" >> "$GITHUB_OUTPUT"

  pr:
    needs: detect
    if: needs.detect.outputs.families != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.detect.outputs.families) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-detector-bump
      - id: bump
        name: Apply this family
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python .github/scripts/bump_detectors.py \
            --k4geo "$K4GEO" --fcc-config "$FCCCONFIG" --family "$FAMILY" --apply \
            > "$RUNNER_TEMP/bump.json"
          cat "$RUNNER_TEMP/bump.json"
          echo "changed=$(jq 'length > 0' "$RUNNER_TEMP/bump.json")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.[0].new // "" | split("_") | last' "$RUNNER_TEMP/bump.json")" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.bump.outputs.changed == 'true'
        with:
          # Events from GITHUB_TOKEN start no workflows, so CI and PR-Agent run
          # only once a maintainer marks this draft ready for review.
          token: ${{ github.token }}
          draft: true
          branch: bump/${{ matrix.family }}
          delete-branch: true
          title: 'feat(benchmarks): bump ${{ matrix.family }} to ${{ steps.bump.outputs.version }}'
          commit-message: 'feat(benchmarks): bump ${{ matrix.family }} to ${{ steps.bump.outputs.version }}'
          body-path: ${{ runner.temp }}/bump-${{ matrix.family }}.md
          labels: detector-bump
          sign-commits: true
