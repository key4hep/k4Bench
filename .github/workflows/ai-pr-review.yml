name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

env:
  CONTAINER_IMAGE: docker.io/pragent/pr-agent@sha256:548b760b81ab4b3f729182428695ccc1194bbf87528c2b1e2b2b07e5223af7b6

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  request:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commands: ${{ steps.request.outputs.commands }}
    steps:
      - name: Check out review scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select commands
        id: request
        run: python3 .github/scripts/ai_pr_review.py --check

  review:
    name: ${{ matrix.command }}
    needs: request
    if: needs.request.outputs.commands != '[]'
    runs-on: [self-hosted, fcc-ironic]
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJSON(needs.request.outputs.commands) }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_AGENT_COMMAND: ${{ matrix.command }}
      CONTAINER_NAME: k4bench-pr-review-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.command }}

    steps:
      - name: Check out review scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run with Kimi K3
        id: kimi
        continue-on-error: true
        env:
          MODEL: openai/Kimi-K3-FLATIRON
          OPENAI__KEY: ${{ secrets.CERN_AIGW_KIMI_API_KEY }}
        run: bash .github/scripts/ai_pr_review.sh

      - name: Run with GLM-5.2
        if: steps.kimi.outcome == 'failure'
        env:
          MODEL: openai/GLM-5.2-NGT
          OPENAI__KEY: ${{ secrets.CERN_AIGW_GLM_API_KEY }}
        run: bash .github/scripts/ai_pr_review.sh

      - name: Remove leftover containers
        if: always()
        run: docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
