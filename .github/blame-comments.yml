# Which repositories the nightly regression bot may comment in.
#
# When a confirmed regression's change window is attributed to a merged pull
# request with a high enough likelihood, k4Bench posts one comment on that pull
# request (and edits it in place on later nights). See
# docs/user-guide/features/pr-comments.md.
#
# Commenting writes into a repository k4Bench does not own, so it is opt-in per
# repository and reviewed here rather than flipped in a CI setting: a suite
# with no repositories listed is inert. Nothing is posted until the
# K4BENCH_PR_COMMENT_TOKEN secret exists; without it every run is a dry run.

# Ranker likelihood (0-100) a pull request must reach before it is commented on.
min_score: 70

# Hard cap on comments per night and suite. More than this means something is
# wrong with the attribution, not that a night really implicated that many pull
# requests.
max_comments: 10

# Repositories that receive comments, as `owner/repo`, for each suite's
# regressions (k4bench/layout.py SUITES). Add one per line under its suite; a
# suite with no list, or an empty one, comments nowhere.
repos:
  sim:
    - key4hep/k4geo
    - HEP-FCC/FCC-config
    - AIDASoft/DD4hep
  # Reconstruction regressions are ranked and mailed, but not yet commented on.
  reco: []
