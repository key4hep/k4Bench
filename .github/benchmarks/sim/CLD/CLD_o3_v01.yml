# k4Bench nightly benchmark config — CLD o3_v01 (ARC PID)
#
# A sim-suite benchmark: the nightly runs each sample below as one ddsim job and
# uploads it to EOS under runs/sim/{concept}/{detector}/, the run tree this
# file's path names (.github/benchmarks/sim/{concept}/{detector}.yml). Keys:
# docs/reference/configuration-reference.md#nightly-benchmark-yaml-keys
#
# CLD_o3_v01 = CLD_o2 with an ARC (Array of RICH Cells) PID subdetector added
# between tracker and calorimeters. Docs (CERN SSO):
# https://fcc-ee-detector-full-sim.docs.cern.ch/CLD/
# Needs CLDConfig's ARC-specific steering file, cld_arc_steer.py, *not*
# cld_steer.py — the plain one leaves the ARC region without a defined
# tracking_volume and ddsim aborts. cld_arc_steer.py itself does
# `from cld_steer import *`, a relative import that only resolves because
# benchmark_job.py puts the steering file's own directory on PYTHONPATH.

# xml:           https://github.com/key4hep/k4geo/blob/main/FCCee/CLD/compact/CLD_o3_v01/CLD_o3_v01.xml
# steering_file: https://github.com/key4hep/CLDConfig/blob/main/CLDConfig/cld_arc_steer.py
xml: FCCee/CLD/compact/CLD_o3_v01/CLD_o3_v01.xml
steering_file: $CLDCONFIG/share/CLDConfig/cld_arc_steer.py

verbose: false

timeout: 600  # 10 hours — a job past this is stuck, not merely slow
sweep: true

# Fixed event seed to minimize random fluctuations in nightly benchmarks
ddsim_args: >-
  --random.seed 42
  --random.enableEventSeed

samples:
  - name: single_e-_10GeV
    n_events: 1100
    ddsim_args: >-
      --enableGun
      --gun.particle e-
      --gun.distribution uniform
      --gun.energy 10*GeV

  - name: p8_ee_Zbb_ecm91
    n_events: 100
    input_files: root://eospublic.cern.ch//eos/experiment/fcc/ee/generation/hepmc/p8_ee_Zbb_ecm91/events_noVtxSmear.hepmc
