# k4Bench nightly benchmark config — IDEA o2 v01
#
# A sim-suite benchmark: the nightly runs each sample below as one ddsim job and
# uploads it to EOS under runs/sim/{concept}/{detector}/, the run tree this
# file's path names (.github/benchmarks/sim/{concept}/{detector}.yml). Keys:
# docs/reference/configuration-reference.md#nightly-benchmark-yaml-keys

# xml:           https://github.com/key4hep/k4geo/blob/main/FCCee/IDEA/compact/IDEA_o2_v01/IDEA_o2_v01.xml
# steering_file: https://github.com/HEP-FCC/FCC-config/blob/main/FCCee/FullSim/IDEA/IDEA_o2_v01/SteeringFile_IDEA_o2_v01.py
xml: FCCee/IDEA/compact/IDEA_o2_v01/IDEA_o2_v01.xml
steering_file: $FCCCONFIG/FullSim/IDEA/IDEA_o2_v01/SteeringFile_IDEA_o2_v01.py

verbose: false

timeout: 600  # 10 hours — a job past this is stuck, not merely slow

# Minutes for the one-event smoke test of detector-bump PRs (default 5): the DR
# tube geometry construction alone takes ~27 min.
smoke_timeout: 45

# Partial sweep — full sweep is currently too long for nightly CI. The DR tube
# geometries cost ~27 min of construction per config before the first event is
# simulated, so every entry here adds over an hour to the job irrespective of
# n_events; the list is kept short for that reason alone.
sweep_detectors:
  - DRBarrelTubes
  - DREndcapTubes
  - DCH_v2
  - SCEPCal_MainLayer

# Fixed event seed to minimize random fluctuations in nightly benchmarks
ddsim_args: >-
  --random.seed 42
  --random.enableEventSeed

samples:
  - name: single_e-_10GeV
    n_events: 600
    ddsim_args: >-
      --enableGun
      --gun.particle e-
      --gun.distribution uniform
      --gun.energy 10*GeV

  - name: p8_ee_Zbb_ecm91
    n_events: 100
    input_files: root://eospublic.cern.ch//eos/experiment/fcc/ee/generation/hepmc/p8_ee_Zbb_ecm91/events_noVtxSmear.hepmc
