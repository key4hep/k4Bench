# k4Bench nightly benchmark config — IDEA o1 v04
#
# A sim-suite benchmark: the nightly runs each sample below as one ddsim job and
# uploads it to EOS under runs/sim/{concept}/{detector}/, the run tree this
# file's path names (.github/benchmarks/sim/{concept}/{detector}.yml). Keys:
# docs/reference/configuration-reference.md#nightly-benchmark-yaml-keys

# FCC-config ships no o1_v04 steering file. The o1_v03 one carries nothing
# version-specific beyond its compactFile default, which our xml: below
# overrides; k4geo's own test_IDEA_o1_v04 runs v04 with it the same way.
#
# xml:           https://github.com/key4hep/k4geo/blob/main/FCCee/IDEA/compact/IDEA_o1_v04/IDEA_o1_v04.xml
# steering_file: https://github.com/HEP-FCC/FCC-config/blob/main/FCCee/FullSim/IDEA/IDEA_o1_v03/SteeringFile_IDEA_o1_v03.py
xml: FCCee/IDEA/compact/IDEA_o1_v04/IDEA_o1_v04.xml
steering_file: $FCCCONFIG/FullSim/IDEA/IDEA_o1_v03/SteeringFile_IDEA_o1_v03.py

verbose: true

timeout: 600  # 10 hours — a job past this is stuck, not merely slow

# Partial sweep — full sweep is currently too long for nightly CI. Each config
# costs ~1 h at the event counts below, so the list holds the four subdetectors
# with the largest share of per-event time or of peak RSS: those are the ones a
# drop-out run can resolve above the regression engine's effect floor. Memory is
# the binding reason to sweep at all — region timing already localises a *time*
# step from baseline, but it carries no memory information.
sweep_detectors:
  - DRcalo
  - DCH_v2
  - SiWrD
  - Muon-System

# Fixed event seed to minimize random fluctuations in nightly benchmarks
ddsim_args: >-
  --random.seed 42
  --random.enableEventSeed

samples:
  - name: single_e-_10GeV
    n_events: 1200
    ddsim_args: >-
      --enableGun
      --gun.particle e-
      --gun.distribution uniform
      --gun.energy 10*GeV

  - name: p8_ee_Zbb_ecm91
    n_events: 100
    input_files: root://eospublic.cern.ch//eos/experiment/fcc/ee/generation/hepmc/p8_ee_Zbb_ecm91/events_noVtxSmear.hepmc
