# k4Bench nightly benchmark config — DD4hep SiD (reference example detector)
#
# A sim-suite benchmark: the nightly runs each sample below as one ddsim job and
# uploads it to EOS under runs/sim/{concept}/{detector}/, the run tree this
# file's path names (.github/benchmarks/sim/{concept}/{detector}.yml). Keys:
# docs/reference/configuration-reference.md#nightly-benchmark-yaml-keys
#
# SiD is DD4hep's own reference/example detector (a CLIC-CDR-era silicon
# tracking + calorimetry detector), not a maintained FCC/Key4hep experiment
# geometry — it exists to exercise DD4hep itself and ships with every DD4hep
# install under $DD4hepINSTALL, so no extra geometry package (like k4geo) is
# needed. Source: https://github.com/AIDASoft/DD4hep/tree/main/DDDetectors
#
# NOTE: SiD's compact XML has ~78 top-level <detector> entries (vs. ~31 for
# ALLEGRO) — many are cables/supports/shields rather than distinct physics
# subdetectors, but --sweep drops every one of them, so this sweep runs ~2.5x
# more sub-configs than any other detector in this repo. Watch the first
# nightly run's wall time; drop back to sweep: false here if it's a problem.

# xml:           https://github.com/AIDASoft/DD4hep/blob/master/DDDetectors/compact/SiD.xml
xml: $DD4hepINSTALL/DDDetectors/compact/SiD.xml
verbose: false

timeout: 600  # 10 hours — a job past this is stuck, not merely slow
sweep: true

# Fixed event seed to minimize random fluctuations in nightly benchmarks
ddsim_args: >-
  --random.seed 42
  --random.enableEventSeed

samples:
  - name: single_e-_10GeV
    n_events: 1000
    ddsim_args: >-
      --enableGun
      --gun.particle e-
      --gun.distribution uniform
      --gun.energy 10*GeV

  - name: p8_ee_Zbb_ecm91
    n_events: 100
    input_files: root://eospublic.cern.ch//eos/experiment/fcc/ee/generation/hepmc/p8_ee_Zbb_ecm91/events_noVtxSmear.hepmc
